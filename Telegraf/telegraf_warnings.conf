[agent]
  interval = "1m"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = true

[[inputs.modbus]]
  name = "PowerLogic4000_Warnings"
  controller = "tcp://modbus-sim:5020"
  timeout = "10s"
  slave_id = 1
  holding_registers = [
    { name = "voltaje",  byte_order = "AB", data_type = "UINT16", address = [0], scale = 0.1},
    { name = "current_l1",     byte_order = "AB", data_type = "UINT16", address = [3], scale = 0.1},
    { name = "active_power",   byte_order = "AB", data_type = "UINT16", address = [6], scale = 1.0}
  ]

# --- CORRECCIÓN FINAL Y ROBUSTA DE LA SECCIÓN PROCESADOR STARLARK ---
[[processors.starlark]]
  source = '''
def apply(metric):
    timestamp_ns = metric.time # Timestamp en nanosegundos

    # Constantes para la conversión (SIN GUIONES BAJOS en los números)
    NS_PER_SECOND = 1000000000 # 10^9 nanosegundos en 1 segundo
    SECONDS_PER_HOUR = 3600       # 3600 segundos en 1 hora
    HOURS_PER_DAY = 24            # 24 horas en un día

    # Convertir nanosegundos a segundos
    timestamp_sec = timestamp_ns // NS_PER_SECOND
    
    # Calcular la hora del día (0-23) en UTC.
    # Dado que el contenedor tiene TZ configurada (America/Argentina/Cordoba),
    # y el reloj del sistema de Docker debería ser local, esto debería ser efectivo.
    hour = (timestamp_sec // SECONDS_PER_HOUR) % HOURS_PER_DAY

    # Definir las franjas horarias
    if hour >= 8 and hour < 20: # 8am a 8pm (hora del contenedor)
        metric.tags["franja_horaria"] = "DIA"
    else: # 8:01pm a 7:59am
        metric.tags["franja_horaria"] = "NOCHE"
    return metric
'''

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "token_telegraf"
  organization = "power_logic"
  bucket = "powerlogic_warnings_tmp"
