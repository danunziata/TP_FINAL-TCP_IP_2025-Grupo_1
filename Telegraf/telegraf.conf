[[processors.starlark]]
  source = '''
def apply(metric):
    # Cálculo de la división entre potencia_activa_a y potencia_aparente_a
    if "potencia_activa_a" in metric.fields and "potencia_aparente_a" in metric.fields:
        potencia_activa = metric.fields["potencia_activa_a"]
        potencia_aparente = metric.fields["potencia_aparente_a"]
        if potencia_aparente != 0:
            metric.fields["factor_potencia_a"] = potencia_activa / potencia_aparente
        else:
            metric.fields["factor_potencia_a"] = 0  # Valor por defecto en caso de división por cero
    
    # Cálculo de la división entre potencia_activa_b y potencia_aparente_b
    if "potencia_activa_b" in metric.fields and "potencia_aparente_b" in metric.fields:
        potencia_activa_b = metric.fields["potencia_activa_b"]
        potencia_aparente_b = metric.fields["potencia_aparente_b"]
        if potencia_aparente_b != 0:
            metric.fields["factor_potencia_b"] = potencia_activa_b / potencia_aparente_b
        else:
            metric.fields["factor_potencia_b"] = 0  # Valor por defecto en caso de división por cero
    
    # Cálculo de la división entre potencia_activa_c y potencia_aparente_c
    if "potencia_activa_c" in metric.fields and "potencia_aparente_c" in metric.fields:
        potencia_activa_c = metric.fields["potencia_activa_c"]
        potencia_aparente_c = metric.fields["potencia_aparente_c"]
        if potencia_aparente_c != 0:
            metric.fields["factor_potencia_c"] = potencia_activa_c / potencia_aparente_c
        else:
            metric.fields["factor_potencia_c"] = 0  # Valor por defecto en caso de división por cero
    
    # Cálculo de la división entre potencia_activa_total y potencia_aparente_total
    if "potencia_activa_total" in metric.fields and "potencia_aparente_total" in metric.fields:
        potencia_activa_total = metric.fields["potencia_activa_total"]
        potencia_aparente_total = metric.fields["potencia_aparente_total"]
        if potencia_aparente_total != 0:
            metric.fields["factor_potencia_total"] = potencia_activa_total / potencia_aparente_total
        else:
            metric.fields["factor_potencia_total"] = 0  # Valor por defecto en caso de división por cero
    
    return metric
'''